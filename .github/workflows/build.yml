name: Build WiiUNX2

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
    paths:
      - 'launcher/**'
      - 'dependencies/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Fix git ownership
      run: git config --global --add safe.directory /__w/WiiUNX2/WiiUNX2
    
    - name: Check Wii U HTTPS library
      run: |
        if dkp-pacman -Q wiiu-curl >/dev/null 2>&1; then
          echo "wiiu-curl is already installed in the devkitPro image."
        else
          dkp-pacman -Sy --noconfirm --needed wiiu-curl
        fi

    - name: Build libgui
      working-directory: dependencies/libgui
      run: make -j$(nproc)
    
    - name: Build librpxloader
      working-directory: dependencies/librpxloader
      run: make -j$(nproc)
    
    - name: Build libwuhbutils
      working-directory: dependencies/libwuhbutils
      run: make -j$(nproc)
    
    - name: Build launcher
      working-directory: launcher
      run: make -j$(nproc)
    
    - name: Get version info
      id: version
      run: |
        VERSION=$(sed -nE 's/^[[:space:]]*#define[[:space:]]+WIIUNX2_VERSION[[:space:]]+"([^"]+)".*/\1/p' launcher/src/common/common.h)
        if [ -z "$VERSION" ]; then
          echo "Could not read WIIUNX2_VERSION from launcher/src/common/common.h" >&2
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
    
    - name: Create build artifact
      run: |
        mkdir -p build-output
        cp launcher/men.rpx build-output/
        cp launcher/men.elf build-output/ || true
        sha256sum build-output/men.rpx | awk '{print $1 "  men.rpx"}' > build-output/men.rpx.sha256
        
        # Create a simple info file
        cat > build-output/BUILD_INFO.txt << EOF
        WiiUNX2 Build Information
        =========================
        Version: ${{ steps.version.outputs.version }}
        Commit: ${{ github.sha }}
        Branch: ${{ github.ref_name }}
        Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        Builder: GitHub Actions
        
        To install:
        1. Power off the Wii U and back up any existing SD:/wiiu/environments/aroma/men.rpx.
        2. Copy men.rpx to SD:/wiiu/environments/aroma/men.rpx.
        3. To remove WiiUNX2, restore the backup or delete the file if none existed.

        Experimental StyleMiiU RPX plugin (WiiUNX2 fork):
        https://github.com/Wiirizon/StyleMiiU-Plugin-RPX
        Download the latest stylemiiu.wps:
        https://github.com/Wiirizon/StyleMiiU-Plugin-RPX/releases/latest/download/stylemiiu.wps
        Put WiiUNX2 at SD:/wiiu/themes/WiiUNX2/men.rpx and follow the plugin README:
        https://github.com/Wiirizon/StyleMiiU-Plugin-RPX#readme
        
        Build logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        EOF
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WiiUNX2-${{ steps.version.outputs.version }}
        path: build-output/
        retention-days: 90
    
    - name: Create release on tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build-output/men.rpx
          build-output/men.rpx.sha256
          build-output/BUILD_INFO.txt
        body: |
          ## WiiUNX2 ${{ steps.version.outputs.version }}

          ### Install in the normal Aroma environment
          1. Download `men.rpx` and `men.rpx.sha256`.
          2. Power off the Wii U. Back up any existing `SD:/wiiu/environments/aroma/men.rpx`.
          3. Verify the checksum, then copy `men.rpx` to `SD:/wiiu/environments/aroma/men.rpx`.
          4. To remove WiiUNX2, restore the backup; if no file existed before installation, delete the `men.rpx` you added.

          ### Optional experimental StyleMiiU RPX route
          [StyleMiiU RPX plugin (WiiUNX2 fork)](https://github.com/Wiirizon/StyleMiiU-Plugin-RPX); [download latest stylemiiu.wps](https://github.com/Wiirizon/StyleMiiU-Plugin-RPX/releases/latest/download/stylemiiu.wps). Put WiiUNX2 at `SD:/wiiu/themes/WiiUNX2/men.rpx` and follow the plugin README. This separate option requires Aroma's RPXLoadingModule and remains experimental.
          
          ### Build Information:
          - Commit: `${{ github.sha }}`
          - Automated build via GitHub Actions
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
