name: Manual Build

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., v0.6.13)'
        required: false
        default: 'dev'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Fix git ownership
      run: git config --global --add safe.directory /__w/WiiUNX2/WiiUNX2
    
    - name: Check Wii U HTTPS library
      run: |
        if dkp-pacman -Q wiiu-curl >/dev/null 2>&1; then
          echo "wiiu-curl is already installed in the devkitPro image."
        else
          dkp-pacman -Sy --noconfirm --needed wiiu-curl
        fi

    - name: Build all dependencies and launcher
      run: |
        cd dependencies/libgui && make -j$(nproc)
        cd ../librpxloader && make -j$(nproc)
        cd ../libwuhbutils && make -j$(nproc)
        cd ../../launcher && make -j$(nproc)
    
    - name: Prepare package
      run: |
        VERSION="${{ github.event.inputs.version_tag }}"
        if [ "$VERSION" = "dev" ]; then
          VERSION="dev-$(date +%Y%m%d-%H%M%S)"
        fi
        
        mkdir -p "WiiUNX2-$VERSION"
        cp launcher/men.rpx "WiiUNX2-$VERSION/"
        sha256sum "WiiUNX2-$VERSION/men.rpx" | awk -v file="men.rpx" '{print $1 "  " file}' > "WiiUNX2-$VERSION/men.rpx.sha256"
        
        cat > "WiiUNX2-$VERSION/README.txt" << EOF
        WiiUNX2 Custom Build
        ====================
        Version: $VERSION
        Built: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        Commit: ${{ github.sha }}
        
        INSTALLATION:
        -------------
        1. Power off the Wii U and back up any existing SD:/wiiu/environments/aroma/men.rpx.
        2. Verify men.rpx with men.rpx.sha256, then copy it to SD:/wiiu/environments/aroma/men.rpx.
        3. To remove WiiUNX2, restore the backup or delete the file if none existed.

        The optional experimental StyleMiiU plugin route is documented in the README and released separately.
        
        Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        EOF
        
        cd "WiiUNX2-$VERSION" && zip -r "../WiiUNX2-$VERSION.zip" * && cd ..
        mkdir -p release-assets
        cp "WiiUNX2-$VERSION.zip" release-assets/
        cp "WiiUNX2-$VERSION/men.rpx" "WiiUNX2-$VERSION/men.rpx.sha256" release-assets/
        cp "WiiUNX2-$VERSION/README.txt" release-assets/BUILD_INFO.txt
    
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: WiiUNX2-${{ github.event.inputs.version_tag }}
        path: release-assets/
        retention-days: 90
    
    - name: Summary
      run: |
        echo "## Build Complete! ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ github.event.inputs.version_tag }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Installation" >> $GITHUB_STEP_SUMMARY
        echo "Copy men.rpx into SD:/wiiu/environments/aroma/ after backing up any existing file." >> $GITHUB_STEP_SUMMARY
        echo "The optional experimental StyleMiiU plugin route is released separately." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download the artifact from the Actions tab above for the package zip and standalone men.rpx/checksum assets. 📦" >> $GITHUB_STEP_SUMMARY
